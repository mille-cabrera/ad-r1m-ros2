# Logitech Gamepad F310 teleoperation for the AD-R1M.
#
# Set the switch on the back of the F310 to "X" (XInput). The indices below follow the
# SDL2 GameController layout used by joy/game_controller_node:
#   axes:    0 LEFTX, 1 LEFTY, 2 RIGHTX, 3 RIGHTY, 4 LT, 5 RT
#            (sticks: up = +1, left = +1)
#   buttons: 0 A, 1 B, 2 X, 3 Y, 4 BACK, 5 LOGITECH, 6 START, 7 L3, 8 R3,
#            9 LB, 10 RB, 11 DPAD_UP, 12 DPAD_DOWN, 13 DPAD_LEFT, 14 DPAD_RIGHT
#
# Controls:
#   hold LB               enable (dead-man switch): no motion unless held
#   hold LB + RB          turbo speeds
#   left stick up/down    forward / backward
#   right stick left/right turn left / right

game_controller_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1
    # Must be faster than the twist_mux "joy" input timeout (0.1 s)
    autorepeat_rate: 20.0
    sticky_buttons: false
    coalesce_interval_ms: 1

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 9          # LB
    enable_turbo_button: 10   # RB

    axis_linear:
      x: 1                    # left stick up/down
    scale_linear:
      x: 0.25                 # m/s
    scale_linear_turbo:
      x: 0.5                  # m/s

    axis_angular:
      yaw: 2                  # right stick left/right
    scale_angular:
      yaw: 0.6                # rad/s
    scale_angular_turbo:
      yaw: 1.0                # rad/s

    inverted_reverse: false
    frame: base_link
